# TP14 parties 2 à 5 : Deployment à compléter progressivement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: tp14
  labels:
    app: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.0
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          # TODO (partie 4) : injecter la ConfigMap whoami-config (envFrom)
          #                   et la clé api-key du Secret whoami-secret (env + secretKeyRef)
          # TODO (partie 5) : readinessProbe et livenessProbe HTTP sur /health, port http
          # TODO (partie 5) : resources.requests (cpu: 50m, memory: 32Mi)
          #                   et resources.limits (cpu: 200m, memory: 64Mi)
