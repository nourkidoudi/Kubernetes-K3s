apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-api
  namespace: tp14
  labels:
    app: nginx-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-api
  template:
    metadata:
      labels:
        app: nginx-api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          command: ["sh", "-c"]
          args:
            - mkdir -p /usr/share/nginx/html/api &&
              echo '{"service":"nginx-api","status":"ok"}' > /usr/share/nginx/html/api/index.html &&
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-api
  namespace: tp14
spec:
  type: ClusterIP
  selector:
    app: nginx-api
  ports:
    - name: http
      port: 80
      targetPort: http
